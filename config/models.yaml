#
# HYDRA model registry. HYDRA only reasons about capabilities, never brands.
#   id             logical name used inside HYDRA
#   runtime_model  name of the model on the physical runtime
#   endpoint       dedicated runtime URL (one vLLM server per model); ${VAR:-default} is expanded
#   tier           1 tiny .. 5 frontier (smart escalation: 3B -> 8B -> 32B -> large -> ensemble)
# Capability numbers are priors: HYDRA replaces them with learned statistics.
#
# provider: ollama | vllm | llamacpp | cloud | mock

models:

  - id: reflex-3b
    provider: ollama
    runtime_model: qwen2.5:3b
    local: true
    tier: 1
    context_window: 32768
    capabilities: {chat: 0.72, reasoning: 0.55, coding: 0.58, vision: 0.0, tools: 0.70, research: 0.50, routing: 0.92}
    estimated_latency_ms: 300

  - id: fast-local
