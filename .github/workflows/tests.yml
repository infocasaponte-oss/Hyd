name: Calibrator checks
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ".[dev]" "sentencepiece>=0.2,<0.3" "protobuf>=4"
      - run: python -m pytest tests -q
      - run: hyd-calibrator --help
