<!doctype html><html lang="es"><meta charset="utf-8"><title>Hyd · revisión humana</title>
<style>body{font:17px system-ui;max-width:800px;margin:40px auto;padding:20px}input,select,textarea,button{font:inherit;padding:10px;margin:6px 0;max-width:100%;box-sizing:border-box}textarea{width:100%;height:90px}pre{white-space:pre-wrap;padding:20px;background:#eef2f5;border-radius:10px}small{display:block;color:#536174}#hint{display:none}</style>
<h1>Revisión humana de Hyd</h1><p>Tu etiqueta alimenta un candidato. La promoción requiere otra evaluación y aprobación.</p>
<label>Ronda <input id="round" placeholder="ronda-001"></label><br>
<label>Clave API <input id="key" type="password" autocomplete="off"></label><br>
<label>Clave administrativa <input id="admin" type="password" autocomplete="off"></label><br>
<label>Revisor <input id="reviewer"></label><br><button id="load">Abrir ronda</button>
<p id="status" role="status"></p><pre id="question"></pre>
<label>Etiqueta <select id="label"><option value="">Escoge una etiqueta</option></select></label>
<textarea id="notes" placeholder="Motivo, ambigüedad o contexto que falta"></textarea>
<button id="save">Guardar y siguiente</button><button id="hints">Ver sugerencias orientativas</button><pre id="hint"></pre>
<button id="tick">Comprobar ronda</button><small>Las claves se mantienen en esta página; no se guardan en el navegador. Exporta los datos con la CLI local.</small>
<script>
const $=id=>document.getElementById(id);let packet=null,index=0;
async function api(suffix,body){let r=await fetch('/hydra/v1/learning/rounds/'+encodeURIComponent($('round').value)+suffix,{method:body?'POST':'GET',headers:{'Content-Type':'application/json','x-api-key':$('key').value,'x-hydra-admin-token':$('admin').value},...(body?{body:JSON.stringify(body)}:{})});let d=await r.json();if(!r.ok)throw Error(d.detail||r.status);return d}
function render(){let c=packet.cases[index];$('question').textContent=c?.text||'No quedan casos en esta cola.';$('hint').style.display='none';$('hint').textContent=JSON.stringify(c?.model_suggestions||{},null,2);$('label').value='';$('notes').value='';$('save').disabled=!c;$('status').textContent=packet.state+' · '+Math.min(index+1,packet.cases.length)+'/'+packet.cases.length}
$('load').onclick=async()=>{try{packet=await api('');packet.cases=packet.cases.filter(c=>!packet.reviews?.[c.id]);index=0;$('label').replaceChildren(...['',...packet.labels,'ambiguous','discard'].map(x=>{let o=document.createElement('option');o.value=x;o.textContent=x||'Escoge una etiqueta';return o}));render()}catch(e){$('status').textContent=e.message}};
$('save').onclick=async()=>{try{let c=packet.cases[index];await api('/review',{case_id:c.id,label:$('label').value,reviewer:$('reviewer').value,notes:$('notes').value});index++;render()}catch(e){$('status').textContent=e.message}};
$('hints').onclick=()=>{$('hint').style.display='block'};
$('tick').onclick=async()=>{try{let r=await api('/tick',{});$('status').textContent=r.state}catch(e){$('status').textContent=e.message}};
</script></html>
